<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="100%" stop-color="#050a18"/>
    </linearGradient>
    <linearGradient id="centerFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a2e"/>
      <stop offset="100%" stop-color="#0b1222"/>
    </linearGradient>
    <linearGradient id="innerFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1b2f"/>
      <stop offset="100%" stop-color="#081223"/>
    </linearGradient>
    <linearGradient id="outerFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#201008"/>
      <stop offset="100%" stop-color="#140803"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#0ff0fc" flood-opacity="0.35"/>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ff6b35" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 600 26px 'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif; fill: #e8f6ff; }
      .subtitle { font: 500 14px 'JetBrains Mono', 'Consolas', monospace; fill: #9bb2d0; letter-spacing: 1px; }
      .card-title { font: 600 20px 'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif; }
      .card-sub { font: 500 14px 'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif; }
      .item { font: 400 14px 'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif; fill: #cfe7ff; }
      .item-outer { fill: #ffe6d3; }
      .caption { font: 500 12px 'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif; fill: #9bb2d0; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="620" fill="url(#bg)"/>
  <rect x="36" y="28" width="1128" height="564" rx="28" stroke="#1c2b45" stroke-width="2" fill="none"/>

  <!-- Center card -->
  <g filter="url(#shadow)">
    <rect x="350" y="70" width="500" height="130" rx="20" fill="url(#centerFill)" stroke="#2a3b5a" stroke-width="2"/>
  </g>
  <text x="600" y="120" text-anchor="middle" class="title">量子烟火</text>
  <text x="600" y="150" text-anchor="middle" class="subtitle">北京交通大学 3D 校园地图</text>

  <!-- Connectors -->
  <line x1="600" y1="200" x2="600" y2="250" stroke="#355072" stroke-width="2"/>
  <circle cx="600" cy="250" r="5" fill="#355072"/>
  <line x1="600" y1="250" x2="260" y2="250" stroke="#355072" stroke-width="2"/>
  <line x1="600" y1="250" x2="940" y2="250" stroke="#355072" stroke-width="2"/>
  <circle cx="260" cy="250" r="4" fill="#355072"/>
  <circle cx="940" cy="250" r="4" fill="#355072"/>

  <!-- Inner card -->
  <g filter="url(#glowCyan)">
    <rect x="90" y="270" width="420" height="250" rx="22" fill="url(#innerFill)" stroke="#0ff0fc" stroke-opacity="0.55" stroke-width="2"/>
  </g>
  <text x="300" y="310" text-anchor="middle" class="card-title" fill="#8ff9ff">里世界 · 量子</text>
  <text x="300" y="336" text-anchor="middle" class="card-sub" fill="#56cfe0">青蓝 · 内在宇宙</text>
  <text x="160" y="380" class="item">• 情感倾诉</text>
  <text x="160" y="406" class="item">• AI陪伴</text>
  <text x="160" y="432" class="item">• 情绪植物</text>
  <text x="160" y="458" class="item">• 时空回响</text>

  <!-- Outer card -->
  <g filter="url(#glowOrange)">
    <rect x="690" y="270" width="420" height="250" rx="22" fill="url(#outerFill)" stroke="#ff6b35" stroke-opacity="0.55" stroke-width="2"/>
  </g>
  <text x="900" y="310" text-anchor="middle" class="card-title" fill="#ffd1b3">表世界 · 烟火</text>
  <text x="900" y="336" text-anchor="middle" class="card-sub" fill="#f2a56c">暖橙 · 日常烟火</text>
  <text x="760" y="380" class="item item-outer">• 美食点评</text>
  <text x="760" y="406" class="item item-outer">• 文豪改写</text>
  <text x="760" y="432" class="item item-outer">• 五维雷达图</text>
  <text x="760" y="458" class="item item-outer">• 食堂导航</text>

  <!-- Caption -->
  <text x="600" y="565" text-anchor="middle" class="caption">双世界 · 双镜头看校园</text>
</svg>
