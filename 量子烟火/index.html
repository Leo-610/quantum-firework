<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" href="/app-icon.png" as="image" />
    <link rel="preload" href="/logo-horizontal.png" as="image" />
    <link rel="preload" href="/bjtu-badge-white.png" as="image" />
    <link rel="preload" href="/bjtu-wordmark-light.png" as="image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050a18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="量子烟火 · 北交大智慧校园情感与美食共鸣智能体 · 里世界与表世界的双面体验" />
    <title>量子烟火 · Quantum Fireworks</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- 高德地图 JS API 2.0 -->
    <script>
      window._AMapSecurityConfig = {
        securityJsCode: '49afb19817ab68d0c4f8017e31f0a838',
      }
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=014815678eb1b4a4bf6508bb84fd4b62&plugin=AMap.HeatMap,AMap.Buildings,AMap.Scale,AMap.ToolBar,AMap.PlaceSearch,AMap.Geocoder"></script>
    
    <!-- Coze Web SDK -->
    <script src="https://lf-cdn.coze.cn/obj/unpkg/latest/coze/web-sdk/dist/js-umd/index.min.js"></script>
  </head>
  <body>
    <!-- JS 加载前的静态启动屏（React 就绪后移除） -->
    <div id="qf-inline-splash" aria-hidden="true">
      <div class="qf-inline-splash__grid"></div>
      <div class="qf-inline-splash__core">
        <img class="qf-inline-splash__badge" src="/bjtu-badge-white.png" alt="" width="56" height="56" />
        <img class="qf-inline-splash__wordmark" src="/bjtu-wordmark-light.png" alt="北京交通大学" />
        <img class="qf-inline-splash__icon" src="/app-icon.png" alt="" width="96" height="96" />
        <img class="qf-inline-splash__logo" src="/logo-horizontal.png" alt="量子烟火" />
      </div>
    </div>
    <style>
      #qf-inline-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050a18;
        overflow: hidden;
      }
      .qf-inline-splash__grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(15,240,252,0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15,240,252,0.06) 1px, transparent 1px);
        background-size: 40px 40px;
        animation: qf-grid-drift 20s linear infinite;
      }
      @keyframes qf-grid-drift {
        from { transform: translateY(0); }
        to { transform: translateY(40px); }
      }
      .qf-inline-splash__core { text-align: center; z-index: 1; }
      .qf-inline-splash__badge {
        width: 56px; height: 56px;
        object-fit: contain;
        margin: 0 auto 8px;
        display: block;
        filter: drop-shadow(0 0 12px rgba(15,240,252,0.45));
      }
      .qf-inline-splash__wordmark {
        width: min(70vw, 200px);
        height: auto;
        margin: 0 auto 16px;
        display: block;
        opacity: 0.85;
        filter: drop-shadow(0 0 8px rgba(15,240,252,0.15));
      }
      .qf-inline-splash__icon {
        width: 96px; height: 96px;
        object-fit: contain;
        margin: 0 auto 14px;
        display: block;
        border-radius: 18px;
        filter: drop-shadow(0 0 16px rgba(15,240,252,0.4));
      }
      .qf-inline-splash__logo {
        width: min(88vw, 320px);
        height: auto;
        margin: 0 auto;
        display: block;
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
