<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/bjtu-badge.png" as="image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050a18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="量子烟火 · 北交大智慧校园情感与美食共鸣智能体 · 里世界与表世界的双面体验" />
    <title>量子烟火 · Quantum Fireworks</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- 高德地图 JS API 2.0 -->
    <script>
      window._AMapSecurityConfig = {
        securityJsCode: '49afb19817ab68d0c4f8017e31f0a838',
      }
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=014815678eb1b4a4bf6508bb84fd4b62&plugin=AMap.HeatMap,AMap.Buildings,AMap.Scale,AMap.ToolBar,AMap.PlaceSearch,AMap.Geocoder"></script>
    
    <!-- Coze Web SDK -->
    <script src="https://lf-cdn.coze.cn/obj/unpkg/latest/coze/web-sdk/dist/js-umd/index.min.js"></script>
  </head>
  <body>
    <!-- JS 加载前的静态启动屏（React 就绪后移除） -->
    <div id="qf-inline-splash" aria-hidden="true">
      <div class="qf-inline-splash__grid"></div>
      <div class="qf-inline-splash__core">
        <img class="qf-inline-splash__badge" src="/bjtu-badge.png" alt="" width="72" height="72" />
        <p class="qf-inline-splash__bjtu">BJTU · 北京交通大学</p>
        <div class="qf-inline-splash__ring"></div>
        <p class="qf-inline-splash__title">量子烟火</p>
        <p class="qf-inline-splash__sub">QUANTUM FIREWORKS</p>
      </div>
    </div>
    <style>
      #qf-inline-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050a18;
        overflow: hidden;
      }
      .qf-inline-splash__grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(15,240,252,0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15,240,252,0.06) 1px, transparent 1px);
        background-size: 40px 40px;
        animation: qf-grid-drift 20s linear infinite;
      }
      @keyframes qf-grid-drift {
        from { transform: translateY(0); }
        to { transform: translateY(40px); }
      }
      .qf-inline-splash__core { text-align: center; z-index: 1; }
      .qf-inline-splash__badge {
        width: 72px; height: 72px;
        object-fit: contain;
        margin: 0 auto 10px;
        display: block;
        filter: drop-shadow(0 0 12px rgba(15,240,252,0.4));
        animation: qf-badge-float 3s ease-in-out infinite;
      }
      @keyframes qf-badge-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .qf-inline-splash__bjtu {
        font-family: 'JetBrains Mono', 'Noto Sans SC', sans-serif;
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        color: rgba(200,230,245,0.55);
        margin: 0 0 14px;
      }
      .qf-inline-splash__ring {
        width: 64px; height: 64px;
        margin: 0 auto 16px;
        border: 2px solid rgba(15,240,252,0.5);
        border-radius: 50%;
        box-shadow: 0 0 24px rgba(15,240,252,0.35);
        animation: qf-ring-spin 2s linear infinite;
      }
      @keyframes qf-ring-spin { to { transform: rotate(360deg); } }
      .qf-inline-splash__title {
        font-family: 'Noto Sans SC', sans-serif;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: #0ff0fc;
        text-shadow: 0 0 20px rgba(15,240,252,0.6);
        margin: 0;
      }
      .qf-inline-splash__sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.65rem;
        letter-spacing: 0.25em;
        color: rgba(200,230,245,0.45);
        margin: 8px 0 0;
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
