  <body>
    <!-- JS 加载前的静态启动屏（React 就绪后移除） -->
    <div id="qf-inline-splash" aria-hidden="true">
      <div class="qf-inline-splash__grid"></div>
      <div class="qf-inline-splash__core">
        <div class="qf-inline-splash__shimmer qf-inline-splash__shimmer--badge"></div>
        <img class="qf-inline-splash__badge" src="/bjtu-badge-white.png" alt="" width="56" height="56" />
        <img class="qf-inline-splash__wordmark" src="/bjtu-wordmark-light.png" alt="北京交通大学" />
        <div class="qf-inline-splash__shimmer qf-inline-splash__shimmer--icon"></div>
        <img class="qf-inline-splash__icon" src="/app-icon.png" alt="" width="96" height="96" />
        <img class="qf-inline-splash__logo" src="/logo-horizontal.png" alt="量子烟火" />
      </div>
      <div class="qf-inline-splash__status" role="status" aria-live="polite">
        <div class="qf-inline-splash__progress-track">
          <div class="qf-inline-splash__progress-bar"></div>
        </div>
        <p class="qf-inline-splash__phase">量子场同步中<span class="qf-inline-splash__dots"><span>.</span><span>.</span><span>.</span></span></p>
      </div>
      <div class="qf-inline-splash__sponsor">
        <p class="qf-inline-splash__sponsor-label">首届「火山杯」AI 应用创新大赛</p>
        <div class="qf-inline-splash__sponsor-row">
          <span>Powered by 扣子编程</span>
          <span aria-hidden="true">×</span>
          <img src="/volcengine-logo-light.png" alt="火山引擎" />
        </div>
      </div>
    </div>
    <style>
      #qf-inline-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050a18;
        overflow: hidden;
      }
      .qf-inline-splash__grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(15,240,252,0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15,240,252,0.06) 1px, transparent 1px);
        background-size: 40px 40px;
        animation: qf-grid-drift 20s linear infinite;
      }
      @keyframes qf-grid-drift {
        from { transform: translateY(0); }
        to { transform: translateY(40px); }
      }
      .qf-inline-splash__core { text-align: center; z-index: 1; position: relative; }
      .qf-inline-splash__shimmer {
        position: absolute;
        border-radius: 12px;
        background: linear-gradient(90deg, rgba(15,240,252,0.06) 0%, rgba(15,240,252,0.18) 50%, rgba(15,240,252,0.06) 100%);
        background-size: 200% 100%;
        animation: qf-shimmer 1.6s ease-in-out infinite;
      }
      .qf-inline-splash__shimmer--badge {
        width: 56px; height: 56px;
        top: 0; left: 50%; transform: translateX(-50%);
      }
      .qf-inline-splash__shimmer--icon {
        width: 96px; height: 96px;
        top: 88px; left: 50%; transform: translateX(-50%);
        border-radius: 18px;
      }
      @keyframes qf-shimmer {
        0% { background-position: 200% 0; opacity: 0.35; }
        100% { background-position: -200% 0; opacity: 0.75; }
      }
      .qf-inline-splash__badge {
        width: 56px; height: 56px;
        object-fit: contain;
        margin: 0 auto 8px;
        display: block;
        filter: drop-shadow(0 0 12px rgba(15,240,252,0.45));
      }
      .qf-inline-splash__wordmark {
        width: min(70vw, 200px);
        height: auto;
        margin: 0 auto 16px;
        display: block;
        opacity: 0.85;
        filter: drop-shadow(0 0 8px rgba(15,240,252,0.15));
      }
      .qf-inline-splash__icon {
        width: 96px; height: 96px;
        object-fit: contain;
        margin: 0 auto 14px;
        display: block;
        border-radius: 18px;
        filter: drop-shadow(0 0 16px rgba(15,240,252,0.4));
      }
      .qf-inline-splash__logo {
        width: min(88vw, 320px);
        height: auto;
        margin: 0 auto;
        display: block;
      }
      .qf-inline-splash__sponsor {
        position: absolute;
        bottom: max(24px, env(safe-area-inset-bottom));
        left: 0;
        right: 0;
        text-align: center;
        z-index: 1;
        padding: 0 16px;
      }
      .qf-inline-splash__sponsor-label {
        font-family: 'Noto Sans SC', sans-serif;
        font-size: 9px;
        letter-spacing: 0.1em;
        color: rgba(200,230,245,0.35);
        margin: 0 0 5px;
      }
      .qf-inline-splash__sponsor-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        flex-wrap: wrap;
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        color: rgba(200,230,245,0.45);
      }
      .qf-inline-splash__sponsor-row img {
        height: 14px;
        width: auto;
        opacity: 0.7;
      }
      .qf-inline-splash__status {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: calc(72px + env(safe-area-inset-bottom));
        z-index: 1;
      }
      .qf-inline-splash__progress-track {
        height: 3px;
        border-radius: 999px;
        background: rgba(15,240,252,0.12);
        overflow: hidden;
      }
      .qf-inline-splash__progress-bar {
        height: 100%;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0ff0fc, #7b2fff);
        box-shadow: 0 0 10px rgba(15,240,252,0.45);
        animation: qf-progress-indeterminate 1.8s ease-in-out infinite;
      }
      @keyframes qf-progress-indeterminate {
        0% { transform: translateX(-120%); width: 35%; }
        50% { width: 55%; }
        100% { transform: translateX(320%); width: 35%; }
      }
      .qf-inline-splash__phase {
        margin: 10px 0 0;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: rgba(180,230,245,0.65);
        text-align: center;
      }
      .qf-inline-splash__dots span {
        animation: qf-dot-blink 1.2s infinite;
      }
      .qf-inline-splash__dots span:nth-child(2) { animation-delay: 0.2s; }
      .qf-inline-splash__dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes qf-dot-blink {
        0%, 20% { opacity: 0.15; }
        50% { opacity: 1; }
        100% { opacity: 0.15; }
      }
      @media (prefers-reduced-motion: reduce) {
        .qf-inline-splash__grid,
        .qf-inline-splash__shimmer,
        .qf-inline-splash__progress-bar,
        .qf-inline-splash__dots span {
          animation: none !important;
        }
        .qf-inline-splash__progress-bar { width: 60%; transform: none; }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
